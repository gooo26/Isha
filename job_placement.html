<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ITI Kuber Nagar - Job Placement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1a2c3e;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #0f2b3d, #1a4a6f);
            color: white;
            padding: 2rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header p {
            opacity: 0.9;
        }

        /* Stats */
        .stats {
            max-width: 1200px;
            margin: -1.5rem auto 2rem;
            padding: 0 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            color: #1a4a6f;
        }

        .stat-label {
            color: #666;
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        /* Search */
        .search-section {
            max-width: 1200px;
            margin: 0 auto 1.5rem;
            padding: 0 1rem;
        }

        .search-box {
            background: white;
            padding: 1rem;
            border-radius: 12px;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .search-box input, .search-box select {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        /* Table */
        .table-container {
            max-width: 1200px;
            margin: 0 auto 2rem;
            padding: 0 1rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            border-collapse: collapse;
        }

        th {
            background: #f8f9fa;
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #1a4a6f;
            border-bottom: 2px solid #e9ecef;
        }

        td {
            padding: 1rem;
            border-bottom: 1px solid #e9ecef;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .salary-badge {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            display: inline-block;
        }

        .trade-badge {
            background: #e3f2fd;
            color: #1565c0;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            display: inline-block;
        }

        .loading, .error {
            text-align: center;
            padding: 3rem;
            color: #666;
        }

        .error button {
            margin-top: 1rem;
            padding: 0.5rem 1.5rem;
            background: #1a4a6f;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            padding: 1.5rem;
            color: #666;
            font-size: 0.8rem;
            border-top: 1px solid #e9ecef;
        }

        @media (max-width: 768px) {
            th, td {
                padding: 0.75rem;
                font-size: 0.85rem;
            }
            .header h1 {
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏢 ITI Kuber Nagar</h1>
        <p>Job Placement Portal</p>
    </div>

    <div class="stats" id="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalCompanies">0</div>
            <div class="stat-label">Total Companies</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="avgSalary">--</div>
            <div class="stat-label">Avg. Salary</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="upcomingDrives">0</div>
            <div class="stat-label">Upcoming Drives</div>
        </div>
    </div>

    <div class="search-section">
        <div class="search-box">
            <input type="text" id="search" placeholder="🔍 Search company, trade or location...">
            <select id="tradeFilter">
                <option value="">All Trades</option>
            </select>
            <select id="locationFilter">
                <option value="">All Locations</option>
            </select>
        </div>
    </div>

    <div class="table-container">
        <div id="tableContent">
            <div class="loading">Loading placement data...</div>
        </div>
    </div>

    <div class="footer">
        <p>Data updated in real-time from Google Sheets</p>
    </div>

    <script>
        // REPLACE THIS WITH YOUR APPS SCRIPT URL
        const SCRIPT_URL = 'YOUR_APPS_SCRIPT_URL_HERE';
        
        let placements = [];

        async function loadData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                if (data.success) {
                    placements = data.placements;
                    updateStats();
                    updateFilters();
                    renderTable();
                    document.getElementById('stats').style.display = 'grid';
                } else {
                    throw new Error(data.error);
                }
            } catch (error) {
                document.getElementById('tableContent').innerHTML = `
                    <div class="error">
                        <p>❌ Unable to load data</p>
                        <p style="font-size: 0.85rem;">Make sure your Google Sheet has headers: Sr. No., Company, Salary Package, Trade, Location, Date</p>
                        <button onclick="loadData()">Retry</button>
                    </div>
                `;
            }
        }

        function updateStats() {
            document.getElementById('totalCompanies').textContent = placements.length;
            
            // Calculate average salary
            let salaries = [];
            placements.forEach(p => {
                let match = p.salary.match(/\d+(?:\.\d+)?/);
                if (match) {
                    let num = parseFloat(match[0]);
                    if (p.salary.includes('Lakh')) num *= 100000;
                    if (p.salary.includes('lakh')) num *= 100000;
                    salaries.push(num);
                }
            });
            
            if (salaries.length > 0) {
                let avg = salaries.reduce((a,b) => a+b, 0) / salaries.length;
                let avgLakhs = (avg / 100000).toFixed(1);
                document.getElementById('avgSalary').innerHTML = `₹${avgLakhs}L`;
            }
            
            // Count upcoming drives
            let today = new Date();
            let upcoming = placements.filter(p => {
                if (p.date && p.date !== 'Date TBA') {
                    let date = new Date(p.date);
                    return date >= today;
                }
                return false;
            });
            document.getElementById('upcomingDrives').textContent = upcoming.length;
        }

        function updateFilters() {
            let trades = new Set();
            let locations = new Set();
            
            placements.forEach(p => {
                p.trade.split(',').forEach(t => trades.add(t.trim()));
                locations.add(p.location);
            });
            
            let tradeSelect = document.getElementById('tradeFilter');
            let locationSelect = document.getElementById('locationFilter');
            
            tradeSelect.innerHTML = '<option value="">All Trades</option>' + 
                Array.from(trades).sort().map(t => `<option value="${t}">${t}</option>`).join('');
            
            locationSelect.innerHTML = '<option value="">All Locations</option>' + 
                Array.from(locations).sort().map(l => `<option value="${l}">${l}</option>`).join('');
        }

        function renderTable() {
            let search = document.getElementById('search').value.toLowerCase();
            let trade = document.getElementById('tradeFilter').value;
            let location = document.getElementById('locationFilter').value;
            
            let filtered = placements.filter(p => {
                let matchSearch = search === '' || 
                    p.company.toLowerCase().includes(search) ||
                    p.trade.toLowerCase().includes(search) ||
                    p.location.toLowerCase().includes(search);
                let matchTrade = trade === '' || p.trade.includes(trade);
                let matchLocation = location === '' || p.location === location;
                return matchSearch && matchTrade && matchLocation;
            });
            
            if (filtered.length === 0) {
                document.getElementById('tableContent').innerHTML = 
                    '<div class="error">No placements found</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr><th>Sr. No.</th><th>Company</th><th>Salary Package</th><th>Trade</th><th>Location</th><th>Date</th></tr>
                    </thead>
                    <tbody>
            `;
            
            filtered.forEach(p => {
                html += `
                    <tr>
                        <td>${p.srNo}</td>
                        <td><strong>${p.company}</strong></td>
                        <td><span class="salary-badge">${p.salary}</span></td>
                        <td><span class="trade-badge">${p.trade}</span></td>
                        <td>📍 ${p.location}</td>
                        <td>📅 ${p.date}</td>
                    </tr>
                `;
            });
            
            html += '</tbody></table>';
            document.getElementById('tableContent').innerHTML = html;
        }

        // Event listeners
        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('tradeFilter').addEventListener('change', renderTable);
        document.getElementById('locationFilter').addEventListener('change', renderTable);
        
        // Load data
        loadData();
        setInterval(loadData, 300000); // Refresh every 5 minutes
    </script>
</body>
</html>
